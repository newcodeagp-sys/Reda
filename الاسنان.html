<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الأسنان</title>
<style>
body { font-family: Tahoma, sans-serif; direction: rtl; background: #eef7f2; margin:0; padding:20px; }
h1 { text-align:center; color:#198754; }
.section { background:#fff; border-radius:10px; padding:15px; margin:15px 0; box-shadow:0 4px 8px rgba(0,0,0,0.1);}
label { font-weight:bold; display:block; margin-bottom:5px; }
input, select, textarea { width:100%; margin-bottom:10px; padding:8px; border:1px solid #ccc; border-radius:8px; }
textarea { height:60px; resize:vertical; }
button { background:#198754; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; }
button:hover { background:#157347; }
.case-entry { background:#eaf8f0; padding:10px; border-radius:10px; margin-top:10px; }
.case-entry img { max-width:100%; border-radius:8px; margin-top:8px; border:1px solid #ccc; }
.flex-row { display:flex; gap:10px; }
.flex-row input { width:48%; }
</style>
</head>
<body>

<h1>🦷 قسم الأسنان</h1>

<div class="section">
    <label>اسم المريض / الحالة</label>
    <textarea id="dentistName" placeholder="أدخل اسم المريض أو نوع الفحص..."></textarea>

    <div class="flex-row">
        <div>
            <label>عمر المريض</label>
            <input type="number" id="dentistAge" placeholder="بالسنوات">
        </div>
    </div>
<div>
    <label>وزن المريض</label>
    <input type="number" id="dentistWeight" placeholder="بالكجم">
</div>

    <label>نوع الفحص / التشخيص</label>
    <select id="dentistExamType">
        <option value="">اختر نوع الفحص</option>
        <option value="كشف أسنان">كشف أسنان</option>
        <option value="أشعة">أشعة</option>
        <option value="حشو">حشو</option>
        <option value="حشو عصب">حشو عصب</option>
        <option value="قشط">قشط</option>
        <option value="معالجة قناة">معالجة قناة</option>
        <option value="متابعة">متابعة</option>
    </select>

    <label>رفع صورة الفحص أو التقرير</label>
    <input type="file" id="dentistFile" accept="image/*">

    <label>ملاحظات الطبيب أو المريض</label>
    <textarea id="dentistNote" placeholder="أدخل ملاحظتك أو تشخيص الحالة..."></textarea>

    <button onclick="saveDentistCase()">حفظ الحالة</button>
</div>

<h2>📋 سجل القسم</h2>
<div id="dentistList"></div>

<script>
const dentistList = document.getElementById('dentistList');

function saveDentistCase() {
    const name = document.getElementById('dentistName').value.trim();
    const age = document.getElementById('dentistAge').value;
    const examType = document.getElementById('dentistExamType').value;
    const note = document.getElementById('dentistNote').value.trim();
    const fileInput = document.getElementById('dentistFile');

    if(!name){
        alert("من فضلك أدخل اسم المريض أو الحالة");
        return;
    }

    const now = new Date();
    const dateStr = now.toLocaleDateString('ar-EG');
    const timeStr = now.toLocaleTimeString('ar-EG');

    function addEntry(imgSrc){
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم المريض:</strong> ${name} <br>
            <strong>العمر:</strong> ${age || "غير محدد"} <br>
            <strong>نوع الفحص:</strong> ${examType || "غير محدد"} <br>
            <strong>التاريخ:</strong> ${dateStr} - <strong>الوقت:</strong> ${timeStr} <br>
            <strong>الملاحظات:</strong> ${note || "لا توجد"} <br>
            ${imgSrc ? `<img src="${imgSrc}" alt="تقرير الأسنان">` : ""}
        `;
        dentistList.prepend(entry);

        // حفظ السجل في localStorage
        let allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
        const key = name + "|" + age + "|" + examType + "|" + note + "|" + dateStr + "|" + timeStr;
        const exists = allRecords.some(r => r.key === key && r.section === "الأسنان");
        if(!exists){
            allRecords.push({ section:"الأسنان", name, age, examType, note, date:dateStr, time:timeStr, image:imgSrc||null, key });
            localStorage.setItem("allMedicalRecords", JSON.stringify(allRecords));
        }
    }

    if(fileInput.files.length > 0){
        const reader = new FileReader();
        reader.onload = function(e){ addEntry(e.target.result); };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        addEntry(null);
    }

    document.getElementById('dentistName').value = "";
    document.getElementById('dentistAge').value = "";
    document.getElementById('dentistExamType').value = "";
    document.getElementById('dentistNote').value = "";
    document.getElementById('dentistFile').value = "";
}

// عرض السجلات عند تحميل الصفحة
window.onload = function(){
    const allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
    allRecords.filter(r=>r.section==="الأسنان").forEach(record=>{
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم المريض:</strong> ${record.name} <br>
            <strong>العمر:</strong> ${record.age || "غير محدد"} <br>
            <strong>نوع الفحص:</strong> ${record.examType || "غير محدد"} <br>
            <strong>التاريخ:</strong> ${record.date} - <strong>الوقت:</strong> ${record.time} <br>
            <strong>الملاحظات:</strong> ${record.note || "لا توجد"} <br>
            ${record.image ? `<img src="${record.image}" alt="تقرير الأسنان">` : ""}
        `;
        dentistList.prepend(entry);
    });
};
</script>

</body>
</html>
