<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم الطوارئ</title>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            direction: rtl;
            background-color: #eef7f2;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #d63333;
        }
        .section {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], input[type="file"], select, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        textarea {
            height: 60px;
            resize: vertical;
        }
        button {
            background-color: #d63333;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b02a2a;
        }
        .case-entry {
            background-color: #ffeaea;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .case-entry img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #ccc;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
        .flex-row input {
            width: 48%;
        }
    </style>
</head>
<body>

    <h1>🚑 قسم الطوارئ</h1>

    <div class="section">
        <label>اسم المريض / الحالة</label>
        <textarea id="erName" placeholder="أدخل اسم المريض أو الحالة..."></textarea>

        <div class="flex-row">
            <div>
                <label>عمر المريض</label>
                <input type="number" id="erAge" placeholder="بالسنوات">
            </div>
            <div>
                <label>وزن المريض</label>
                <input type="number" id="erWeight" placeholder="بالكجم">
            </div>
        </div>

        <label>نوع الحالة / التشخيص</label>
        <select id="erExamType">
            <option value="">اختر نوع الحالة</option>
            <option value="إصابة">إصابة</option>
            <option value="حادث">حادث</option>
            <option value="حالة مرضية مفاجئة">حالة مرضية مفاجئة</option>
            <option value="أخرى">أخرى</option>
        </select>

        <label>رفع صورة الفحص أو التقرير</label>
        <input type="file" id="erFile" accept="image/*">

        <label>ملاحظات الطبيب أو المريض</label>
        <textarea id="erNote" placeholder="أدخل ملاحظتك أو تشخيص الحالة..."></textarea>

        <button onclick="saveERCase()">حفظ الحالة</button>
    </div>

    <h2>📋 سجل المريض</h2>
    <div id="erList"></div>

    <script>
        const erList = document.getElementById('erList');

        function saveERCase() {
            const name = document.getElementById('erName').value.trim();
            const age = document.getElementById('erAge').value.trim();
            const weight = document.getElementById('erWeight').value.trim();
            const examType = document.getElementById('erExamType').value;
            const note = document.getElementById('erNote').value.trim();
            const fileInput = document.getElementById('erFile');

            if(!name){
                alert("من فضلك أدخل اسم المريض أو الحالة");
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('ar-EG');
            const timeStr = now.toLocaleTimeString('ar-EG');

            if(fileInput.files.length > 0){
                const reader = new FileReader();
                reader.onload = function(e){
                    addEREntry(name, age, weight, examType, note, dateStr, timeStr, e.target.result);
                }
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addEREntry(name, age, weight, examType, note, dateStr, timeStr, null);
            }

            // مسح الحقول بعد الحفظ
            document.getElementById('erName').value = "";
            document.getElementById('erAge').value = "";
            document.getElementById('erWeight').value = "";
            document.getElementById('erExamType').value = "";
            document.getElementById('erNote').value = "";
            document.getElementById('erFile').value = "";
        }

        function addEREntry(name, age, weight, examType, note, dateStr, timeStr, imgSrc){
            // عرض داخل القسم
            const entry = document.createElement('div');
            entry.className = "case-entry";
            entry.innerHTML = `
                <strong>اسم المريض:</strong> ${name} <br>
                <strong>العمر:</strong> ${age || "غير محدد"} <br>
                <strong>الوزن:</strong> ${weight || "غير محدد"} <br>
                <strong>نوع الفحص:</strong> ${examType || "غير محدد"} <br>
                <strong>الملاحظات:</strong> ${note || "لا توجد"} <br>
                <strong>التاريخ:</strong> ${dateStr} - <strong>الوقت:</strong> ${timeStr} <br>
                ${imgSrc ? `<img src="${imgSrc}" alt="تقرير الحالة">` : ""}
            `;
            erList.prepend(entry);

            // حفظ نسخة في localStorage للسجلات بدون تكرار
            const record = { section:"الطوارئ", name, age, weight, examType, note, date: dateStr, time: timeStr, image: imgSrc || null };
            let allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];

            // منع التكرار (بناءً على الاسم والتاريخ والوقت)
            const exists = allRecords.some(r => r.name === record.name && r.date === record.date && r.time === record.time);
            if(!exists){
                allRecords.push(record);
                localStorage.setItem("allMedicalRecords", JSON.stringify(allRecords));
            }

            // نقل البيانات لموقع خارجي (ملف السجلات الآخر)
            try {
                if(window.opener && !window.opener.closed){
                    window.opener.postMessage(record, "*"); // إرسال البيانات
                }
            } catch(e){
                console.warn("لم يتمكن من إرسال البيانات للموقع الخارجي:", e);
            }
        }
    </script>

</body>
</html>
