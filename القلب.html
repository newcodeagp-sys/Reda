<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم القلب</title>
<style>
body {
    font-family: 'Tahoma', sans-serif;
    direction: rtl;
    background-color: #fdeff2;
    margin: 0;
    padding: 20px;
}
h1 { text-align: center; color: #dc3545; }
.section {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
label { font-weight: bold; display: block; margin-bottom: 5px; }
input[type="file"], textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
}
textarea { height: 60px; resize: vertical; }
button { background-color: #dc3545; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
button:hover { background-color: #b02a37; }
.case-entry {
    background-color: #ffe8eb;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
}
.case-entry img {
    max-width: 100%;
    border-radius: 8px;
    margin-top: 8px;
    border: 1px solid #ccc;
}
</style>
</head>
<body>

<h1>❤️ قسم القلب</h1>

<div class="section">
    <label>اسم الحالة / التقرير</label>
    <textarea id="heartName" placeholder="أدخل اسم الحالة أو نوع الفحص..."></textarea>

    <label>رفع صورة التحليل أو الأشعة</label>
    <input type="file" id="heartFile" accept="image/*">

    <label>ملاحظات الطبيب أو المريض</label>
    <textarea id="heartNote" placeholder="أدخل الملاحظات أو التشخيص..."></textarea>

    <button onclick="saveHeartCase()">حفظ الحالة</button>
</div>

<h2>📋 سجل المريض</h2>
<div id="heartList"></div>

<script>
const heartList = document.getElementById('heartList');

function saveHeartCase() {
    const name = document.getElementById('heartName').value.trim();
    const note = document.getElementById('heartNote').value.trim();
    const fileInput = document.getElementById('heartFile');

    if(!name){
        alert("من فضلك أدخل اسم الحالة أو التقرير");
        return;
    }

    const now = new Date();
    const dateStr = now.toLocaleDateString('ar-EG');
    const timeStr = now.toLocaleTimeString('ar-EG');

    function addEntry(imgSrc){
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم الحالة:</strong> ${name} <br>
            <strong>الملاحظات:</strong> ${note || "لا توجد"} <br>
            <strong>التاريخ:</strong> ${dateStr} - <strong>الوقت:</strong> ${timeStr} <br>
            ${imgSrc ? `<img src="${imgSrc}" alt="تقرير الحالة">` : ""}
        `;
        heartList.prepend(entry);

        // حفظ نسخة في localStorage
        let allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
        const key = name + "|" + note + "|" + dateStr + "|" + timeStr;
        const exists = allRecords.some(r => r.key === key && r.section === "القلب");
        if(!exists){
            const record = {
                section: "القلب",
                name,
                note,
                date: dateStr,
                time: timeStr,
                image: imgSrc || null,
                key
            };
            allRecords.push(record);
            localStorage.setItem("allMedicalRecords", JSON.stringify(allRecords));
        }
    }

    if(fileInput.files.length > 0){
        const reader = new FileReader();
        reader.onload = function(e){
            addEntry(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        addEntry(null);
    }

    // مسح الحقول بعد الحفظ
    document.getElementById('heartName').value = "";
    document.getElementById('heartNote').value = "";
    document.getElementById('heartFile').value = "";
}

// تحميل البيانات عند فتح الصفحة
window.onload = function(){
    const allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
    allRecords.filter(r => r.section === "القلب").forEach(record => {
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم الحالة:</strong> ${record.name} <br>
            <strong>الملاحظات:</strong> ${record.note || "لا توجد"} <br>
            <strong>التاريخ:</strong> ${record.date} - <strong>الوقت:</strong> ${record.time} <br>
            ${record.image ? `<img src="${record.image}" alt="تقرير الحالة">` : ""}
        `;
        heartList.prepend(entry);
    });
};
</script>

</body>
</html>
