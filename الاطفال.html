<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الأطفال</title>
<style>
body {
    font-family: 'Tahoma', sans-serif;
    direction: rtl;
    background-color: #eef7f2;
    margin: 0;
    padding: 20px;
}
h1 { text-align:center; color:#198754; }
.section {
    background: #fff;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
label { font-weight: bold; display: block; margin-bottom: 5px; }
input[type="text"], input[type="number"], input[type="file"], select, textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 8px;
}
textarea { height: 60px; resize: vertical; }
button { background-color: #198754; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
button:hover { background-color: #157347; }
.case-entry { background-color: #eaf8f0; padding: 10px; border-radius: 10px; margin-top: 10px; }
.case-entry img { max-width: 100%; border-radius: 8px; margin-top: 8px; border:1px solid #ccc; }
.flex-row { display: flex; gap:10px; }
.flex-row input { width:48%; }
</style>
</head>
<body>

<h1>🧒 قسم الأطفال</h1>

<div class="section">
    <label>اسم الطفل / الحالة</label>
    <textarea id="childName" placeholder="أدخل اسم الطفل أو الحالة..."></textarea>

    <div class="flex-row">
        <div>
            <label>عمر الطفل (بالسنوات)</label>
            <input type="number" id="childAge" placeholder="مثلاً: 5">
        </div>
        <div>
            <label>الوزن (كجم)</label>
            <input type="number" id="childWeight" placeholder="مثلاً: 20">
        </div>
    </div>

    <label>نوع الفحص / التشخيص</label>
    <select id="childExamType">
        <option value="">اختر نوع الفحص</option>
        <option value="فحص دوري">فحص دوري</option>
        <option value="تحاليل">تحاليل</option>
        <option value="أشعة">أشعة</option>
        <option value="تشخيص مرض">تشخيص مرض</option>
    </select>

    <label>رفع صورة الفحص أو التقرير</label>
    <input type="file" id="childFile" accept="image/*">

    <label>ملاحظات الطبيب أو المريض</label>
    <textarea id="childNote" placeholder="أدخل ملاحظتك أو تشخيص الحالة..."></textarea>

    <button onclick="saveChildCase()">حفظ الحالة</button>
</div>

<h2>📋 سجل الطفل</h2>
<div id="childList"></div>

<script>
const childList = document.getElementById('childList');

function saveChildCase() {
    const name = document.getElementById('childName').value.trim();
    const age = document.getElementById('childAge').value;
    const weight = document.getElementById('childWeight').value;
    const examType = document.getElementById('childExamType').value;
    const note = document.getElementById('childNote').value;
    const fileInput = document.getElementById('childFile');

    if(!name){
        alert("من فضلك أدخل اسم الطفل أو الحالة");
        return;
    }

    const now = new Date();
    const dateStr = now.toLocaleDateString('ar-EG');
    const timeStr = now.toLocaleTimeString('ar-EG');

    function addEntry(imgSrc){
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم الطفل:</strong> ${name} <br>
            <strong>العمر:</strong> ${age || "غير محدد"} <br>
            <strong>الوزن:</strong> ${weight || "غير محدد"} <br>
            <strong>نوع الفحص:</strong> ${examType || "غير محدد"} <br>
            <strong>الملاحظات:</strong> ${note || "لا توجد"} <br>
            <strong>التاريخ:</strong> ${dateStr} - <strong>الوقت:</strong> ${timeStr} <br>
            ${imgSrc ? `<img src="${imgSrc}" alt="تقرير الطفل">` : ""}
        `;
        childList.prepend(entry);

        // حفظ نسخة في السجلات العامة بدون تكرار
        let allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
        const key = name + "|" + age + "|" + weight + "|" + examType + "|" + note + "|" + dateStr + "|" + timeStr;
        const exists = allRecords.some(r => r.key === key && r.section === "الأطفال");
        if(!exists){
            const record = {
                section: "الأطفال",
                name,
                age,
                weight,
                examType,
                note,
                date: dateStr,
                time: timeStr,
                image: imgSrc || null,
                key
            };
            allRecords.push(record);
            localStorage.setItem("allMedicalRecords", JSON.stringify(allRecords));
        }
    }

    if(fileInput.files.length > 0){
        const reader = new FileReader();
        reader.onload = function(e){
            addEntry(e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        addEntry(null);
    }

    // مسح الحقول بعد الحفظ
    document.getElementById('childName').value = "";
    document.getElementById('childAge').value = "";
    document.getElementById('childWeight').value = "";
    document.getElementById('childExamType').value = "";
    document.getElementById('childNote').value = "";
    document.getElementById('childFile').value = "";
}

// تحميل البيانات الموجودة عند فتح الصفحة
window.onload = function(){
    const allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
    allRecords.filter(r => r.section === "الأطفال").forEach(record => {
        const entry = document.createElement('div');
        entry.className = "case-entry";
        entry.innerHTML = `
            <strong>اسم الطفل:</strong> ${record.name} <br>
            <strong>العمر:</strong> ${record.age || "غير محدد"} <br>
            <strong>الوزن:</strong> ${record.weight || "غير محدد"} <br>
            <strong>نوع الفحص:</strong> ${record.examType || "غير محدد"} <br>
            <strong>الملاحظات:</strong> ${record.note || "لا توجد"} <br>
            <strong>التاريخ:</strong> ${record.date} - <strong>الوقت:</strong> ${record.time} <br>
            ${record.image ? `<img src="${record.image}" alt="تقرير الطفل">` : ""}
        `;
        childList.prepend(entry);
    });
};
</script>

</body>
</html>
