<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل مستخدم - مشروع التخرج</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url('https://png.pngtree.com/thumb_back/fh260/background/20240522/pngtree-abstract-blur-hospital-clinic-medical-interior-background-image_15683664.jpg') no-repeat center center fixed;
  background-size: cover;

}
.container {
  background-color: rgba(105, 158, 228, 0.938);
  padding: 30px 35px;
  border-radius: 20px;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
}
.container h2 { text-align: center; margin-bottom: 25px; color: #333; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;
}
button {
  padding: 12px 20px; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 10px; width: 100%;
  background: #4facfe; color: #fff; transition: 0.3s;
}
button:hover { background: #00f2fe; }
.alert { margin-top: 10px; text-align: center; font-weight: bold; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
  <h2>تسجيل مستخدم جديد</h2>

  <div class="form-group">
    <label>الاسم بالكامل</label>
    <input type="text" id="fullName" placeholder="أدخل الاسم بالكامل">
  </div>

  <div class="form-group">
    <label>الرقم القومي</label>
    <input type="text" id="nationalID" placeholder="أدخل الرقم القومي" maxlength="14">
  </div>

  <div class="form-group">
    <label>رقم الهاتف</label>
    <input type="text" id="phone" placeholder="أدخل رقم الهاتف" maxlength="11">
  </div>

  <div class="form-group">
    <label>رقم التسلسل</label>
    <input type="text" id="serialNumber" placeholder="أدخل الرقم التسلسلي" maxlength="8">
  </div>

  <div class="form-group">
    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="أدخل كلمة المرور" maxlength="6">
  </div>

  <div class="form-group">
    <label>تاريخ الميلاد</label>
    <input type="date" id="birthDate">
  </div>

  <div class="form-group">
    <label>الجنس</label>
    <select id="gender">
      <option value="">اختر الجنس</option>
      <option value="male">ذكر</option>
      <option value="female">أنثى</option>
    </select>
  </div>

  <div class="form-group">
    <label>فصيلة الدم</label>
    <select id="bloodType">
      <option value="">اختر فصيلة الدم</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
    </select>
  </div>

  <div class="form-group">
    <label>الأمراض المزمنة</label>
    <input type="text" id="chronicDiseases" placeholder="مثال: ضغط، سكر">
  </div>

  <div class="form-group">
    <label>الحساسية</label>
    <input type="text" id="allergies" placeholder="مثال: غبار، طعام">
  </div>

  <div class="form-group">
    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني">
  </div>

  <button id="verifyIDBtn">التحقق من الرقم القومي</button>
  <button id="sendEmailOTPBtn">إرسال رمز التحقق OTP</button>

  <div class="form-group" style="margin-top:10px;">
    <label>أدخل رمز OTP:</label>
    <input type="text" id="emailOTPInput" placeholder="أدخل الرمز">
    <button id="verifyEmailOTPBtn">تحقق</button>
  </div>

  <button id="loginBtn">تسجيل الدخول</button>
  <div class="alert" id="alertMsg"></div>
</div>

<script>
const verifyIDBtn = document.getElementById("verifyIDBtn");
const sendEmailOTPBtn = document.getElementById("sendEmailOTPBtn");
const verifyEmailOTPBtn = document.getElementById("verifyEmailOTPBtn");
const loginBtn = document.getElementById("loginBtn");
const alertMsg = document.getElementById("alertMsg");

let isVerified = false;
let emailOTP = "";
let otpVerified = false;

// التحقق من الرقم القومي
verifyIDBtn.addEventListener("click", () => {
  const nationalID = document.getElementById("nationalID").value;
  if(nationalID.length === 14){
    isVerified = true;
    alertMsg.style.color = "green";
    alertMsg.innerText = "تم التحقق من الرقم القومي بنجاح ✔";
  } else {
    alertMsg.style.color = "red";
    alertMsg.innerText = "الرقم القومي غير صحيح ❌";
  }
});

// إرسال OTP وهمي
sendEmailOTPBtn.addEventListener("click", () => {
  const email = document.getElementById("email").value;
  if(email === ""){
    alertMsg.style.color = "red";
    alertMsg.innerText = "يرجى إدخال البريد الإلكتروني ❌";
    return;
  }
  emailOTP = Math.floor(100000 + Math.random()*900000);
  alertMsg.style.color = "blue";
  alertMsg.innerText = `تم إرسال رمز التحقق OTP على البريد: ${emailOTP}`;
});

// تحقق OTP
verifyEmailOTPBtn.addEventListener("click", () => {
  const enteredOTP = document.getElementById("emailOTPInput").value;
  if(enteredOTP === emailOTP.toString()){
    otpVerified = true;
    alertMsg.style.color = "green";
    alertMsg.innerText = "تم التحقق من البريد الإلكتروني ✅";
  } else {
    alertMsg.style.color = "red";
    alertMsg.innerText = "الرمز غير صحيح ❌";
  }
});

// تسجيل الدخول مع شروط رقم التسلسل والباسوورد
loginBtn.addEventListener("click", () => {
  const serial = document.getElementById("serialNumber").value;
  const password = document.getElementById("password").value;

  if(!isVerified){
    alertMsg.style.color = "red";
    alertMsg.innerText = "يرجى التحقق من الرقم القومي أولاً ❌";
    return;
  }
  if(!otpVerified){
    alertMsg.style.color = "red";
    alertMsg.innerText = "يرجى التحقق من البريد الإلكتروني أولاً ❌";
    return;
  }
  if(serial.length !== 8){
    alertMsg.style.color = "red";
    alertMsg.innerText = "رقم التسلسل يجب أن يكون 8 أرقام ❌";
    return;
  }
  if(password.length < 6){
    alertMsg.style.color = "red";
    alertMsg.innerText = "كلمة المرور يجب أن تكون 6 أحرف أو أكثر ❌";
    return;
  }

  // تخزين البيانات في LocalStorage
  const userData = {
    fullName: document.getElementById("fullName").value,
    nationalID: document.getElementById("nationalID").value,
    phone: document.getElementById("phone").value,
    serialNumber: serial,
    password: password,
    birthDate: document.getElementById("birthDate").value,
    gender: document.getElementById("gender").value,
    bloodType: document.getElementById("bloodType").value,
    chronicDiseases: document.getElementById("chronicDiseases").value,
    allergies: document.getElementById("allergies").value,
    email: document.getElementById("email").value
  };
  localStorage.setItem("userData", JSON.stringify(userData));

  window.location.href = "الجديد.html"; // الصفحة الرئيسية
});
</script>

</body>
</html>
