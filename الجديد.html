<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق ويب شبيه بالموبايل</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: Arial, sans-serif;}
body{background:#000000;display:flex;justify-content:center;}
.phone{
  width: 100%; height:100vh; background:#787899; overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.header{padding:14px 15px; font-size:18px; font-weight:600; border-bottom:1px solid #000000; background:#699ff1;}
.logo-container {
  text-align: center;
  background-color: #70a4f1;
  margin-top: 1px;  /* مسافة من فوق */
  margin-bottom: 1px; /* مسافة من تحت */
}

.logo {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
}

.line{height:25px; background:#78b2f5bb; display:flex; align-items:center; justify-content:center; padding:0 13px; font-size:23px; border-bottom:2px solid #000;}
.content{flex:1; overflow-y:auto; padding:15px; background:#f8f9fb;}
.section{margin-bottom:20px;}
.section-title{font-size:15px; font-weight:600; margin-bottom:8px;}
.card{background:#d8d3d3; padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid #0000009d;}
.bottom-nav{height:60px; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #000; background:#dad3d3;}
.nav-item{text-align:center; color:#777; font-size:13px; cursor:pointer;}
.nav-item.active{color:#0d6efd;font-weight:600;}
.alarm-container {width: 300px; margin: 20px auto; padding: 20px; background: #111; color: #fff; text-align: center; border-radius: 15px;}
.alarm-inputs select {padding: 10px; margin: 5px; border-radius: 8px; font-size: 16px;}
button {margin-top: 15px; padding: 10px 20px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer;}
#set-alarm {background: #28a745;color: white;}
#clear-alarm {background: #dc3545;color: white;}
#current-time {margin-top: 20px; font-size: 22px; font-weight: bold;}
@keyframes blink {0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;}}
/* زر واتساب */
.whatsapp-btn {
  display: block;
  width: 90%;
  margin: 15px auto;
  padding: 12px;
  text-align: center;
  background: #25D366;
  color: #fff;
  font-size: 16px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
  border: 1px solid #128C7E;
}
.whatsapp-btn:hover {
  background: #1ebe5b;
  transform: scale(1.03);
}
.whatsapp-btn i { margin-left: 8px; font-size: 20px; }

.alarm-list-item { background:#222; padding:10px; margin:5px; border-radius:8px; color: #fff; display:flex; align-items:center; justify-content:space-between; }

/* سجلات */
.case-entry { background:#eaf8f0; padding:10px; border-radius:10px; margin-bottom:10px; position:relative; }
.case-entry img { max-width:100%; border-radius:8px; margin-top:8px; border:1px solid #ccc; }
.delete-btn { position:absolute; top:10px; left:10px; background:#dc3545; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; }
.delete-btn:hover { background:#b02a37; }
.clear-all-btn { background:#198754; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; margin-bottom:10px; }
.clear-all-btn:hover { background:#0f6f43; }
/* نسبة الشحن */
/* صندوق البطارية */
.battery-box {
  width: 25px;
  height: 15px;
  border: 2px solid #000;
  border-radius: 6px;
  position: absolute;
  top: 1px;
  left: 17px;   /* هنا بقّت فوق على الشمال */
  background: #fff;
}

/* القطعة الصغيرة في طرف البطارية */
.battery-box::after {
  content: "";
  position: absolute;
  right: -6px;
  top: 2px;
  width: 3px;
  height: 7px;
  background: #000;
  border-radius: 2px;
}

/* نسبة الشحن */
.battery-level {
  height: 100%;
  background: #4caf50;
  width: 80%; /* نسبة الشحن */
  transition: 0.3s;
}

</style>
</head>
<body>

<div class="phone">
  <span id="live-time"> --:-- </span>




  <div class="status">
  <div class="battery-box">
    <div id="battery-level" class="battery-level"></div>
  </div>
  <div class="status">

  <div class="left-icons">
      <div class="battery-box">
          <div class="battery-level"></div>
      </div>


  </div>
</div>
</div>

  <div class="header">متابعه حالتك</div>
  <div class="logo-container">
  <img src="logo.jpg" class="logo">
</div>
  <div class="line"><h6>تحت اشراف وزارة الصحة</h6></div>

  <!-- الصفحة الرئيسية -->
  <div id="page-home" class="content page">
    <div class="section">
      <div class="card">الكارت الصحي الذكي</div>

    </div>
    <div class="section">

    </div>
  </div>

  <!-- السجلات -->
  <div id="page-records" class="content page" style="display:none;">
    <div class="section-title">
      <h1>السجلات الطبية</h1></div>
    <div id="allRecordsList"></div>
  </div>

  <!-- الرسائل -->
  <div id="page-messages" class="content page" style="display:none;">
    <div class="section-title">الرسائل</div>
    <div class="card">دكتور علي: كلمني بخصوص النتيجة</div>
    <div class="card">العيادة: موعد فحص</div>
    <!-- وسيلة تواصل واتساب -->
    <a href="https://wa.me/201016737230" target="_blank" style="text-decoration:none;">
      <div class="card" style="background:#25D366; color:white; font-weight:bold;">
        <i class="fa-brands fa-whatsapp"></i> تواصل عبر الواتساب
      </div>
    </a>
  </div>

  <!-- المنبه -->
  <div id="page-alarm" class="content page" style="display:none;">
    <div class="alarm-container">
      <h2>ضبط المنبه</h2>
      <div class="alarm-inputs">
        <select id="hour"></select>
        <select id="minute"></select>
        <select id="ampm">
          <option>AM</option>
          <option>PM</option>
         </select>
      </div>
      <button id="set-alarm">تفعيل المنبه</button>
      <button id="clear-alarm" style="display:none;">إيقاف المنبه</button>
      <div id="current-time"></div>
      <div id="alarm-message" style="display:none; margin-top:15px; font-weight:bold; font-size:18px; color:red; animation: blink 1s infinite;">
        ⏰ وقت المنبه!
      </div>
    </div>
  </div>
  <!-- حسابي -->
  <div id="page-profile" class="content page" style="display:none;">
    <div class="section-title">بياناتي</div>
    <div id="profileData" class="card"></div>
    <div style="margin-top:15px; text-align:center;">
      <button id="logoutBtn" style="background:#ff4d4d; color:white; width:80%;">تسجيل الخروج</button>
    </div>
  </div>

  <!-- التنقل السفلي -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchPage('home', this)">🏠<br>الرئيسية</div>
    <div class="nav-item" onclick="switchPage('records', this)">📁<br>السجلات</div>
    <div class="nav-item" onclick="switchPage('messages', this)">💬<br>الرسائل</div>
    <div class="nav-item" onclick="switchPage('alarm', this)">⏰<br>منبه</div>
    <div class="nav-item" onclick="switchPage('profile', this)">👤<br>حسابي</div>
  </div>
</div>

<audio id="alarm-audio" src="https://freesound.org/data/previews/316/316847_4939433-lq.mp3"></audio>

<script>
function switchPage(page, element){
  document.querySelectorAll(".page").forEach(p => p.style.display="none");
  document.getElementById("page-" + page).style.display = "block";
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  element.classList.add("active");
}

// الساعة الحقيقية
function updateTime() {
    const now = new Date();
    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();
    let ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    hours = hours < 10 ? "0"+hours : hours;
    minutes = minutes < 10 ? "0"+minutes : minutes;
    seconds = seconds < 10 ? "0"+seconds : seconds;
    document.getElementById("live-time").innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
}

// تحديث البيانات من LocalStorage
function updateUserData(){
  const data = JSON.parse(localStorage.getItem("userData"));
  if(data){
    const html = `
      الاسم:- ${data.fullName}<br>
      الرقم القومي:- ${data.nationalID}<br>
      رقم الهاتف:- ${data.phone}<br>
      ID:- ${data.serialNumber}<br>
      فصيلة الدم:- ${data.bloodType}<br>
      الإيميل:- ${data.email}<br>
      الأمراض المزمنة:- ${data.chronicDiseases}<br>
      الحساسية:- ${data.allergies}
    `;
    document.getElementById("profileData").innerHTML = html;
  }
}

/* ======= جزء المنبّه (معدّل ليصبح متعدد المنبّهات) ======= */

// عناصر DOM الخاصة بالمنبّه
const hourSelect = document.getElementById("hour");
const minuteSelect = document.getElementById("minute");
const ampmSelect = document.getElementById("ampm");
const setBtn = document.getElementById("set-alarm");
const clearBtn = document.getElementById("clear-alarm");
const currentTimeDiv = document.getElementById("current-time");
const alarmAudio = document.getElementById("alarm-audio");
const alarmMessage = document.getElementById("alarm-message");

// مصفوفة لكل المنبّهات (محفوظة في localStorage)
let alarms = JSON.parse(localStorage.getItem("alarmsList")) || [];

// تجهيز الاختيارات للساعات والدقائق
for(let i=1;i<=12;i++) hourSelect.innerHTML += `<option>${i<10?'0'+i:i}</option>`;
for(let i=0;i<60;i++) minuteSelect.innerHTML += `<option>${i<10?'0'+i:i}</option>`;

// إضافة منبّه جديد
setBtn.addEventListener("click", () => {
    let time = `${hourSelect.value}:${minuteSelect.value} ${ampmSelect.value}`;

    alarms.push(time);
    localStorage.setItem("alarmsList", JSON.stringify(alarms));

    alert("تم إضافة منبّه جديد: " + time);

    displayAlarms();
});

// عرض المنبّهات (ينشأ عنصر عرض داخل صفحة المنبه)
function displayAlarms() {
    let box = document.getElementById("alarm-list-box");

    if(!box){
        box = document.createElement("div");
        box.id = "alarm-list-box";
        box.style.marginTop = "20px";
        box.style.textAlign = "center";
        box.style.color = "white";
        box.style.fontSize = "18px";
        document.querySelector("#page-alarm .alarm-container").appendChild(box);
    }

    if(alarms.length === 0){
      box.innerHTML = "<h3 style='color:#fff;'>لا توجد منبّهات مضافة</h3>";
      return;
    }

    box.innerHTML = "<h3 style='color:#fff;'>المنبّهات المضافة:</h3>";

    alarms.forEach((al, index) => {
        box.innerHTML += `
          <div class="alarm-list-item">
             <span>${al}</span>
             <div>
               <button onclick="deleteAlarm(${index})"
                style="padding:5px 10px; background:#dc3545; border:none; color:white; border-radius:6px; margin-right:10px;">
                حذف
               </button>
               <button onclick="snoozeAlarm(${index})"
                style="padding:5px 10px; background:#0d6efd; border:none; color:white; border-radius:6px;">
                غفوة
               </button>
             </div>
          </div>`;
    });
}

// حذف منبّه
function deleteAlarm(index){
    alarms.splice(index,1);
    localStorage.setItem("alarmsList", JSON.stringify(alarms));
    displayAlarms();
}

// غفوة قصيرة: يؤجل الرنين 5 دقائق (يبقي المنبّه في القائمة)
function snoozeAlarm(index){
  // مؤقت غفوة بسيط: نوقف الصوت ونعرض رسالة
  alarmAudio.pause();
  alarmAudio.currentTime = 0;
  alarmMessage.style.display = "none";
  alert("تم تأجيل المنبّه 5 دقائق (غفوة).");
  // نستخدم setTimeout محلي فقط لإعادة تشغيل الصوت بعد 5 دقائق
  setTimeout(() => {
    alarmAudio.play();
    alarmMessage.style.display = "block";
  }, 5 * 60 * 1000);
}

// تشغيل المنبّهات كل ثانية (يقارن الوقت الحالي مع كل المنبّهات)
setInterval(() => {
    const now = new Date();

    let h = now.getHours() % 12 || 12;
    let m = now.getMinutes();
    let s = now.getSeconds();
    let ampm = now.getHours() >= 12 ? "PM" : "AM";

    h = h < 10 ? "0" + h : h;
    m = m < 10 ? "0" + m : m;

    currentTimeDiv.innerText = `${h}:${m}:${s<10?'0'+s:s} ${ampm}`;

    const currentFormatted = `${h}:${m} ${ampm}`;

    alarms.forEach((time, idx) => {
        if(time === currentFormatted){
            // لتفادي تكرار التشغيل لكل ثانية، نتحقق إن كان تم وضع علامة تشغيل لهذا الوقت
            const lastTriggeredKey = `alarm_last_triggered_${time}_${idx}`;
            const lastTriggered = localStorage.getItem(lastTriggeredKey);
            const nowMs = Date.now();

            // إذا لم يُشغّل خلال آخر دقيقة نسمح بالتشغيل
            if(!lastTriggered || nowMs - parseInt(lastTriggered) > 60 * 1000){
              alarmAudio.play().catch(()=>{ /* منع خطأ لو الصوت محجوب */ });
              alarmMessage.style.display = "block";
              localStorage.setItem(lastTriggeredKey, nowMs.toString());
            }
        }
    });

}, 1000);

// زر إيقاف الرنين الحالي (لا يمسح المنبّهات)
clearBtn.addEventListener("click", () => {
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
    alarmMessage.style.display = "none";

    alert("تم إيقاف الرنين (المنبّهات تبقى موجودة).");

    // إعادة عرض المنبّهات للتحديث
    displayAlarms();
});

/* ======= نهاية جزء المنبّه ======= */


window.onload = function(){
  updateTime();
  setInterval(updateTime,1000);
  updateUserData();

  // عرض المنبّهات المحفوظة عند فتح الصفحة
  displayAlarms();

  // تسجيل الخروج
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("userData");
    alert("تم تسجيل الخروج بنجاح!");
    window.location.href = "login.html";
  });

  loadRecords();
};

// إدارة السجلات
function loadRecords(){
  const allRecordsList = document.getElementById("allRecordsList");
  allRecordsList.innerHTML = '';
  const allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
  allRecords.forEach((record, index) => {
    const entry = document.createElement("div");
    entry.className = "case-entry";
    entry.innerHTML = `
        <strong>القسم:</strong> ${record.section} <br>
        <strong>اسم المريض:</strong> ${record.name} <br>
        <strong>العمر:</strong> ${record.age || "غير محدد"} <br>
        <strong>نوع الفحص:</strong> ${record.examType || "غير محدد"} <br>
        <strong>الملاحظات:</strong> ${record.note || "لا توجد"} <br>
        <strong>التاريخ:</strong> ${record.date} - <strong>الوقت:</strong> ${record.time} <br>
        ${record.image ? `<img src="${record.image}" style="max-width:100%; border:1px solid #ccc; border-radius:8px;">` : ""}
    `;
    allRecordsList.prepend(entry);
  });
}

function deleteRecord(index){
  let allRecords = JSON.parse(localStorage.getItem("allMedicalRecords")) || [];
  allRecords.splice(index,1);
  localStorage.setItem("allMedicalRecords", JSON.stringify(allRecords));
  loadRecords();
}


</script>
</body>
</html>
